{% extends 'base.html' %}

{% block title %}Contato - Reino Animal{% endblock %}

{% block content %}
<h2>Envie sua Curiosidade 📬</h2>
<p>Conhece um fato incrível sobre algum animal? Envie para nossa equipe!</p>

{% if mensagem_sucesso %}
    <p style="background-color: #27ae60; color: #fff; padding: 10px; border-radius: 5px;">
        {{ mensagem_sucesso }}
    </p>
{% endif %}

<form action="/contato" method="POST" style="background-color: #1e262c; padding: 20px; border-radius: 8px;">
    <p>
        <label for="nome"><strong>Seu Nome:</strong></label><br>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required style="width: 100%; padding: 8px; margin-top: 5px; border-radius: 4px; border: 1px solid #ccc;">
    </p>
    
    <p style="margin-top: 15px;">
        <label for="email"><strong>E-mail:</strong></label><br>
        <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required style="width: 100%; padding: 8px; margin-top: 5px; border-radius: 4px; border: 1px solid #ccc;">
    </p>
    
    <p style="margin-top: 15px;">
        <label for="mensagem"><strong>Curiosidade ou Mensagem:</strong></label><br>
        <textarea id="mensagem" name="mensagem" rows="4" placeholder="Escreva sobre qual animal você gostaria de ver aqui..." required style="width: 100%; padding: 8px; margin-top: 5px; border-radius: 4px; border: 1px solid #ccc;"></textarea>
    </p>
    
    <p style="margin-top: 15px;">
        <button type="submit" style="background-color: #2ecc71; color: #12181b; padding: 10px 20px; border: none; font-weight: bold; border-radius: 5px; cursor: pointer;">Enviar Curiosidade</button>
    </p>
</form>
{% endblock %}
